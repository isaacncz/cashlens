<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f3" />
    <title>CashflowLens.MY — A little financial clarity</title>
    <link rel="preload" href="./fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="Understand your cashflow with interactive Malaysian financial lessons and a repeat-sales calculator. No account needed." />
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('cashflow-lens-preferences') || '{}');
        const dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.reduceMotion = String(p.reduceMotion === true);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#121c17' : '#f5f7f3';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
